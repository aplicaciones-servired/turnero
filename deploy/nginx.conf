# =============================================================================
# turnero.serviredgane.cloud  (Cloudflare -> origen HTTP:80)
#   /            -> kiosco (React SPA)
#   /caja/       -> caja + admin (React SPA)
#   /pantalla/   -> visualizador (Framework7)
#   /api/        -> API NestJS
#   /socket.io/  -> Socket.IO (WebSocket)
#   /media/      -> imagenes y videos del API
# =============================================================================
upstream turnero_api {
    server turnero-api:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name turnero.serviredgane.cloud _;

    root /usr/share/nginx/html/kiosk;
    index index.html;

    charset utf-8;
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cloudflare delante: el IP real del cliente llega en CF-Connecting-IP.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    # -------- API --------
    location /api/ {
        proxy_pass http://turnero_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    # -------- Socket.IO (WebSocket) --------
    location /socket.io/ {
        proxy_pass http://turnero_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -------- Medios del API (imagenes / videos) --------
    location /media/ {
        proxy_pass http://turnero_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # -------- Caja --------
    location = /caja { return 301 /caja/; }
    location /caja/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /caja/index.html;
    }

    # -------- Pantalla --------
    location = /pantalla { return 301 /pantalla/; }
    location /pantalla/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /pantalla/index.html;
    }

    # -------- Kiosco (raiz) --------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
