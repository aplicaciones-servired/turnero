# =============================================================================
# turnero.serviredgane.cloud  (Cloudflare -> origen HTTP:80)
#   /            -> kiosco (React SPA)
#   /caja/       -> caja + admin (React SPA)
#   /pantalla/   -> visualizador (Framework7)
#   /api/        -> API NestJS
#   /socket.io/  -> Socket.IO (WebSocket)
#   /media/      -> imagenes y videos del API
# =============================================================================

# Resolver interno de Docker (127.0.0.11) con TTL corto: asi `turnero-api`
# se vuelve a resolver cada 10s. Sin esto nginx guarda la IP del contenedor
# y, cuando el API se recrea en un despliegue, queda en 502 y la pantalla
# deja de actualizarse hasta reiniciar el contenedor web.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name turnero.serviredgane.cloud _;

    root /usr/share/nginx/html/kiosk;
    index index.html;

    charset utf-8;
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cloudflare delante: el IP real del cliente llega en CF-Connecting-IP.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    # Se usa una variable (y no un `upstream` fijo) para forzar la re-resolucion
    # del nombre del contenedor; ver el `resolver` de arriba.
    set $turnero_api "http://turnero-api:3001";

    # -------- API --------
    location /api/ {
        proxy_pass $turnero_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    # -------- Socket.IO (WebSocket) --------
    location /socket.io/ {
        proxy_pass $turnero_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -------- Medios del API (imagenes / videos) --------
    location /media/ {
        proxy_pass $turnero_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # -------- HTML: nunca cachear (los assets llevan ?v=) --------
    # Sin esto, Cloudflare y los navegadores se quedan con un index.html viejo
    # y una pantalla en blanco aunque el origen ya este corregido.
    location = / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /caja/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /caja/index.html =404;
    }

    location = /caja/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /pantalla/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /pantalla/index.html =404;
    }

    location = /pantalla/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # -------- Caja --------
    location = /caja { return 301 /caja/; }
    location /caja/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /caja/index.html;
    }

    # -------- Pantalla --------
    location = /pantalla { return 301 /pantalla/; }
    location /pantalla/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /pantalla/index.html;
    }

    # -------- Kiosco (raiz) --------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
