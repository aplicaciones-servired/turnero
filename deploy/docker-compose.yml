# =============================================================================
# Turnero - stack de produccion (mismo servidor: Docker + nginx).
# Uso:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# =============================================================================
name: turnero

services:
  api:
    image: turnero-api:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    stop_grace_period: 30s
    # Sin rotacion, los logs de Docker llenan el disco del servidor y tumban
    # todo el stack de golpe.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      # API_URL publica (informativo); el front usa rutas relativas /api.
      API_URL: https://turnero.serviredgane.cloud
      CORS_ORIGINS: https://turnero.serviredgane.cloud
      GRADLE_USER_HOME: /gradle-cache
      PRINTER_CHARACTER_SET: ${PRINTER_CHARACTER_SET:-PC850_MULTILINGUAL}
    volumes:
      - media:/app/apps/api/public/media
      - gradle-cache:/gradle-cache
      - android-build:/app/apps/display-android/app/build
      - apk-dist:/app/apps/display-android/dist
    networks:
      red-gane-int:
        # Alias unico: en red-gane-int hay otros contenedores con el alias `api`.
        aliases:
          - turnero-api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    image: turnero-web:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: /api
        VITE_MEDIA_URL: /media
        CASHIER_BASE: /caja/
        DISPLAY_BASE: /pantalla/
        VITE_SCREEN: ${DISPLAY_SCREEN:-1}
        VITE_PRINT_AGENT_URL: ${PRINT_AGENT_URL:-http://localhost:9110}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        # Ojo: `service_healthy` haria que `up -d` espere al API para siempre
        # si la base legacy no responde al arrancar (el API reintenta y muere).
        # nginx ya resuelve la IP del API en cada peticion (ver nginx.conf).
        condition: service_started
    networks:
      red-gane-int:
        # Alias unico: en red-gane-int hay otros contenedores con el alias `web`.
        aliases:
          - turnero-web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  media:
  gradle-cache:
  android-build:
  apk-dist:

networks:
  red-gane-int:
    external: true
