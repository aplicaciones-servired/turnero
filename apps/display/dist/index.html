        <script>
            /* Diagnostico: si la app no arranca, mostrar el error en pantalla
               en vez de quedarse en blanco. */
            window.__turneroErr = "";
            window.addEventListener("error", function (e) {
                window.__turneroErr = (e.message || "")
                    + (e.filename ? " @ " + e.filename + ":" + (e.lineno || 0) : "");
            });
            window.addEventListener("unhandledrejection", function (e) {
                try {
                    window.__turneroErr = "Promise: " + (e.reason && (e.reason.message || e.reason));
                } catch (x) { }
            });
            setTimeout(function () {
                var el = document.getElementById("app");
                if (!el || el.classList.contains("framework7-root")) return;
                var d = document.createElement("div");
                d.style.cssText = "position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;"
                    + "background:#111;color:#fff;font-family:sans-serif;padding:32px;overflow:auto";
                var detalle = window.__turneroErr || "sin detalle (el JS no llego a ejecutarse)";
                d.innerHTML = "<h2 style='color:#ff5555;margin:0 0 12px'>TURNERO: la pantalla no arranco</h2>"
                    + "<p>El navegador no pudo iniciar la aplicacion.</p>"
                    + "<pre style='white-space:pre-wrap;background:#1b1b1b;padding:12px;"
                    + "border-radius:8px;color:#ffd479;font-size:15px'></pre>"
                    + "<p style='color:#aaa;font-size:13px'></p>";
                d.querySelector("pre").textContent = detalle;
                d.querySelectorAll("p")[1].textContent = "Navegador: " + navigator.userAgent;
                document.body.appendChild(d);
            }, 8000);
        </script>
    </head>
